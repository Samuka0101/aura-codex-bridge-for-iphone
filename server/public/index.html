<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><title>Aura</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div class="orb"></div><div><h1>Aura</h1><small id="status">pronta para conectar</small></div><button id="settings">⚙︎</button></header><section id="chat"><article class="aura">Fala, mano. Posso verificar o iPhone e ajustar tweaks. Mudanças sempre pedem sua confirmação.</article></section><form id="form"><textarea id="message" rows="1" placeholder="Peça alguma coisa…"></textarea><button type="submit">↑</button></form></main>
